[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "k1score"
version = "0.1.0"
description = "K-1 kickboxing scoring: tools to build datasets and models from fight videos"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "pyarrow",
  "pyyaml",
  "opencv-python",
  "yt-dlp",
  "ultralytics",
  "lap",
  "scipy",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
k1 = "k1score.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
